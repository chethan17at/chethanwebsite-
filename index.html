<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐳 Docker Demo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .whale { font-size: 5rem; margin-bottom: 1rem; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    h1 { font-size: 1.8rem; margin-bottom: 0.4rem; color: #58a6ff; }
    p.subtitle { color: #8b949e; margin-bottom: 2rem; font-size: 0.95rem; }

    .info-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .info-box p { font-size: 0.9rem; color: #8b949e; margin-bottom: 0.6rem; }
    .info-box span { color: #3fb950; font-weight: 600; }

    .counter-section { margin-bottom: 1.8rem; }
    .counter-section p { color: #8b949e; margin-bottom: 0.6rem; font-size: 0.9rem; }
    #count {
      font-size: 3rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .btn {
      background: #238636;
      color: white;
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin: 0.3rem;
    }
    .btn:hover { background: #2ea043; }
    .btn.secondary { background: #21262d; border: 1px solid #30363d; }
    .btn.secondary:hover { background: #30363d; }

    .badge {
      display: inline-block;
      background: #1f6feb33;
      border: 1px solid #1f6feb;
      color: #58a6ff;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="whale">🐳</div>
    <h1>Hello from Docker!</h1>
    <p class="subtitle">This app is running inside a container 🎉</p>

    <div class="info-box">
      <p>📦 Container running since: <span id="startTime">—</span></p>
      <p>🌐 Served by: <span>Nginx (inside Docker)</span></p>
      <p>📂 Port mapped: <span>8080 → 80</span></p>
    </div>

    <div class="counter-section">
      <p>🖱️ Button click counter (stored in the browser)</p>
      <div id="count">0</div>
    </div>

    <div>
      <button class="btn" onclick="increment()">Click Me! 🚀</button>
      <button class="btn secondary" onclick="reset()">Reset</button>
    </div>

    <div class="badge">✅ Container is healthy and running</div>
  </div>

  <script>
    // Show when the page was first loaded
    document.getElementById('startTime').textContent =
      new Date().toLocaleTimeString();

    // Simple click counter
    let count = 0;

    function increment() {
      count++;
      document.getElementById('count').textContent = count;
    }

    function reset() {
      count = 0;
      document.getElementById('count').textContent = count;
    }
  </script>
</body>
</html>
